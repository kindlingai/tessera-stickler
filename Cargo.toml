[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/kindlingai/tessera-stickler"

[workspace.dependencies]
stickler-check = { path = "crates/check" }
stickler-findings = { path = "crates/findings" }
stickler-lint = { path = "crates/lint" }
stickler-maps = { path = "crates/maps" }
stickler-shape = { path = "crates/shape" }
stickler-simcheck = { path = "crates/simcheck" }
stickler-style = { path = "crates/style" }
# One tessera revision for every tessera crate.
tessera-frontend-settings = { git = "https://github.com/kindlingai/tessera", rev = "ad98139d7ec6b4717aa81b14bb4685f3fb34f173" }
tessera-publish = { git = "https://github.com/kindlingai/tessera", rev = "ad98139d7ec6b4717aa81b14bb4685f3fb34f173" }
tessera-tasks = { git = "https://github.com/kindlingai/tessera", rev = "ad98139d7ec6b4717aa81b14bb4685f3fb34f173" }
tessera-testkit = { git = "https://github.com/kindlingai/tessera", rev = "ad98139d7ec6b4717aa81b14bb4685f3fb34f173" }

[profile.release]
lto = "thin"
