[package]
name = "stickler"
version = "0.1.0"
description = "Code-shape, prose-style and near-copy checks for tessera"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
stickler-check.workspace = true
stickler-lint.workspace = true
stickler-simcheck.workspace = true
stickler-style.workspace = true

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/kindlingai/tessera-stickler"

[workspace.dependencies]
stickler-check = { path = "crates/check" }
stickler-findings = { path = "crates/findings" }
stickler-lint = { path = "crates/lint" }
stickler-shape = { path = "crates/shape" }
stickler-simcheck = { path = "crates/simcheck" }
stickler-style = { path = "crates/style" }
# One tessera revision for every tessera crate.
tessera-frontend-settings = { git = "https://github.com/kindlingai/tessera", rev = "fa1dcf9d33c4bb72194ab25c0c63ab0ec520b7f8" }
tessera-publish = { git = "https://github.com/kindlingai/tessera", rev = "fa1dcf9d33c4bb72194ab25c0c63ab0ec520b7f8" }
tessera-tasks = { git = "https://github.com/kindlingai/tessera", rev = "fa1dcf9d33c4bb72194ab25c0c63ab0ec520b7f8" }
tessera-testkit = { git = "https://github.com/kindlingai/tessera", rev = "fa1dcf9d33c4bb72194ab25c0c63ab0ec520b7f8" }

[profile.release]
lto = "thin"
