name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The maps test reads the tessera revision that Cargo.toml pins.
      - name: Check out the pinned tessera revision
        run: |
          rev=$(sed -n 's|.*kindlingai/tessera", rev = "\([0-9a-f]*\)".*|\1|p' Cargo.toml | head -n 1)
          # The rust cache can restore an older checkout here.
          rm -rf target/tessera
          git init -q target/tessera
          git -C target/tessera fetch -q --depth 1 https://github.com/kindlingai/tessera "$rev"
          git -C target/tessera checkout -q FETCH_HEAD
      - run: cargo nextest run --workspace --locked
      - run: cargo build --release --locked
      - run: ./target/release/stickler 2>&1 | grep -q usage
      # stickler checks this repository with its own rules.
      - run: ./target/release/stickler lint
      # The fetchers' pinned model revisions, cached by revision.
      - if: matrix.os == 'ubuntu-latest'
        id: spacy
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/spacy
          key: spacy-en-core-web-sm-8fb6f8155286360bf5486fe399e2738d1df7ded2
      - if: matrix.os == 'ubuntu-latest' && steps.spacy.outputs.cache-hit != 'true'
        run: ./target/release/stickler style fetch "$RUNNER_TEMP/spacy"
      - if: matrix.os == 'ubuntu-latest'
        id: eg2
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/eg2-text
          key: eg2-text-914f7f89142e33e77833254d9c9b90c3cef7303b
      - if: matrix.os == 'ubuntu-latest' && steps.eg2.outputs.cache-hit != 'true'
        run: ./target/release/stickler simcheck fetch "$RUNNER_TEMP/eg2-text"
