name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The maps test reads the tessera revision that Cargo.toml pins.
      - name: Check out the pinned tessera revision
        run: |
          rev=$(sed -n 's|.*kindlingai/tessera", rev = "\([0-9a-f]*\)".*|\1|p' Cargo.toml | head -n 1)
          git init -q target/tessera
          git -C target/tessera fetch -q --depth 1 https://github.com/kindlingai/tessera "$rev"
          git -C target/tessera checkout -q FETCH_HEAD
      - run: cargo nextest run --workspace --locked
      - run: cargo build --release --locked
      - run: ./target/release/stickler 2>&1 | grep -q usage
      # stickler checks this repository with its own rules.
      - run: ./target/release/stickler lint
