[package]
name = "stickler-simcheck"
version = "0.1.0"
description = "Fails on near-copies of code, found with EmbeddingGemma 2 embeddings"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
half = "2"
eg2cpu = { git = "https://github.com/undrgrnd-labs/hunch", rev = "a80156abbf8ec2e5a9b85ed0e5ff98454c1aaa09" }
stickler-findings.workspace = true
stickler-shape.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rayon = "1"
ureq = "2"
